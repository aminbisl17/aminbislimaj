<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" width="680" height="170">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- Monogram -->
  <g transform="translate(24, 32)">
    <rect x="0" y="0" width="88" height="88" rx="14" 
          fill="none" stroke="#F1F5F9" stroke-width="2"/>
    
    <!-- Accent mark -->
    <rect x="0" y="0" width="14" height="3" rx="1" fill="url(#accent)"/>
    
    <!-- Clean AB -->
    <text x="44" y="58" 
          font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="42" 
          font-weight="700" 
          fill="#F1F5F9"
          text-anchor="middle"
          letter-spacing="-1.5">AB</text>
  </g>

  <!-- Primary name -->
  <text x="138" y="72" 
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="38" 
        font-weight="700" 
        fill="#F1F5F9"
        letter-spacing="-0.8">Amin Bislimaj</text>

  <!-- Tagline -->
  <text x="138" y="102" 
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="13.5" 
        font-weight="500" 
        fill="#94A3B8"
        letter-spacing="3.2">SOFTWARE CREATOR</text>

  <!-- Accent line -->
  <rect x="138" y="116" width="92" height="2" rx="1" fill="url(#accent)"/>
</svg>
