<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 340" width="1360" height="340">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- Monogram -->
  <g transform="translate(48, 64)">
    <rect x="0" y="0" width="176" height="176" rx="28" 
          fill="none" stroke="#0F172A" stroke-width="4"/>
    
    <!-- Accent mark -->
    <rect x="0" y="0" width="28" height="6" rx="2" fill="url(#accent)"/>
    
    <!-- Clean AB -->
    <text x="88" y="116" 
          font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="84" 
          font-weight="700" 
          fill="#0F172A"
          text-anchor="middle"
          letter-spacing="-3">AB</text>
  </g>

  <!-- Primary name -->
  <text x="276" y="144" 
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="76" 
        font-weight="700" 
        fill="#0F172A"
        letter-spacing="-1.6">Amin Bislimaj</text>

  <!-- Tagline -->
  <text x="276" y="204" 
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="27" 
        font-weight="500" 
        fill="#475569"
        letter-spacing="6.4">SOFTWARE CREATOR</text>

  <!-- Accent line -->
  <rect x="276" y="232" width="184" height="4" rx="2" fill="url(#accent)"/>
</svg>
